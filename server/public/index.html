<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
  :root {
    --bg: #f2f4f7;
    --surface: #ffffff;
    --ink: #1c2330;
    --muted: #5d6778;
    --line: #dde2ea;
    --accent: #0f6b5f;
    --accent-ink: #ffffff;
    --danger: #b3261e;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  label { display: block; font-size: 0.9rem; font-weight: 600; margin: 12px 0 4px; }
  input, textarea { width: 100%; font: inherit; color: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  textarea { min-height: 96px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.danger { color: var(--danger); }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .error { color: var(--danger); font-size: 0.9rem; min-height: 1.3em; margin: 10px 0 0; }
  .note { border-top: 1px solid var(--line); padding: 14px 0; }
  .note:first-child { border-top: 0; padding-top: 0; }
  .note h3 { margin: 0 0 4px; font-size: 1rem; }
  .note p { margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note small { color: var(--muted); }
  .empty { color: var(--muted); margin: 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>

  <!-- Auth view -->
  <section id="auth" class="hidden">
    <h1>Notes</h1>
    <p class="sub">Sign in to see your notes. Only you can see them.</p>
    <div class="panel">
      <h2 id="auth-title">Log in</h2>
      <div id="name-wrap" class="hidden">
        <label for="name">Name</label>
        <input id="name" autocomplete="name">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <p id="auth-error" class="error" role="alert"></p>
      <div class="row">
        <button id="auth-submit" class="primary">Log in</button>
        <button id="auth-toggle" class="link" type="button">Create an account</button>
      </div>
    </div>
  </section>

  <!-- Notes view -->
  <section id="app" class="hidden">
    <div class="topbar">
      <div>
        <h1>Your notes</h1>
        <p class="sub" id="who"></p>
      </div>
      <button id="logout">Log out</button>
    </div>

    <div class="panel">
      <h2 id="form-title">New note</h2>
      <label for="title">Title</label>
      <input id="title" maxlength="120">
      <label for="content">Content</label>
      <textarea id="content"></textarea>
      <p id="note-error" class="error" role="alert"></p>
      <div class="row">
        <button id="save" class="primary">Save note</button>
        <button id="cancel" class="hidden">Cancel edit</button>
      </div>
    </div>

    <div class="panel" id="list"></div>
  </section>

</main>

<script>
  // Same-origin by default (Express serves this file). Set a full URL if hosting the frontend separately,
  // e.g. const API = "https://your-backend.onrender.com/api";
  const API = "/api";

  const $ = (id) => document.getElementById(id);
  let mode = "login";      // "login" | "signup"
  let editingId = null;

  const getToken = () => { try { return localStorage.getItem("token"); } catch { return null; } };
  const setToken = (t) => { try { t ? localStorage.setItem("token", t) : localStorage.removeItem("token"); } catch {} };
  const noteId = (n) => n._id || n.id;

  async function api(path, method = "GET", body) {
    const headers = { "Content-Type": "application/json" };
    const token = getToken();
    if (token) headers.Authorization = "Bearer " + token;
    const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    let data = null;
    try { data = await res.json(); } catch {}
    if (res.status === 401 && token) { logout(); throw new Error("Session expired. Please log in again."); }
    if (!res.ok) throw new Error((data && (data.message || data.error)) || "Request failed (" + res.status + ")");
    return data;
  }

  function show(view) {
    $("auth").classList.toggle("hidden", view !== "auth");
    $("app").classList.toggle("hidden", view !== "app");
  }

  function setMode(m) {
    mode = m;
    const signup = m === "signup";
    $("auth-title").textContent = signup ? "Create account" : "Log in";
    $("auth-submit").textContent = signup ? "Create account" : "Log in";
    $("auth-toggle").textContent = signup ? "I already have an account" : "Create an account";
    $("name-wrap").classList.toggle("hidden", !signup);
    $("password").autocomplete = signup ? "new-password" : "current-password";
    $("auth-error").textContent = "";
  }

  async function submitAuth() {
    $("auth-error").textContent = "";
    const body = { email: $("email").value.trim(), password: $("password").value };
    if (mode === "signup") body.name = $("name").value.trim();
    if (!body.email || !body.password || (mode === "signup" && !body.name)) {
      $("auth-error").textContent = "Fill in all fields.";
      return;
    }
    try {
      const data = await api("/auth/" + mode, "POST", body);
      setToken(data.token);
      $("password").value = "";
      await openApp();
    } catch (e) { $("auth-error").textContent = e.message; }
  }

  function logout() {
    setToken(null);
    editingId = null;
    show("auth");
  }

  async function openApp() {
    show("app");
    $("who").textContent = "";
    resetForm();
    await loadNotes();
  }

  async function loadNotes() {
    const list = $("list");
    try {
      const data = await api("/notes");
      const notes = Array.isArray(data) ? data : (data.notes || []);
      list.replaceChildren();
      if (!notes.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "No notes yet. Write your first one above.";
        list.appendChild(p);
        return;
      }
      notes.forEach((n) => list.appendChild(renderNote(n)));
    } catch (e) { list.textContent = e.message; }
  }

  function renderNote(n) {
    const div = document.createElement("div");
    div.className = "note";
    const h = document.createElement("h3"); h.textContent = n.title;
    const p = document.createElement("p"); p.textContent = n.content || "";
    div.append(h, p);
    if (n.updatedAt || n.createdAt) {
      const s = document.createElement("small");
      s.textContent = new Date(n.updatedAt || n.createdAt).toLocaleString();
      div.appendChild(s);
    }
    const row = document.createElement("div");
    row.className = "row";
    const edit = document.createElement("button"); edit.textContent = "Edit";
    edit.onclick = () => startEdit(n);
    const del = document.createElement("button"); del.textContent = "Delete"; del.className = "danger";
    del.onclick = () => removeNote(noteId(n));
    row.append(edit, del);
    div.appendChild(row);
    return div;
  }

  function startEdit(n) {
    editingId = noteId(n);
    $("title").value = n.title;
    $("content").value = n.content || "";
    $("form-title").textContent = "Edit note";
    $("save").textContent = "Update note";
    $("cancel").classList.remove("hidden");
    $("title").focus();
  }

  function resetForm() {
    editingId = null;
    $("title").value = "";
    $("content").value = "";
    $("note-error").textContent = "";
    $("form-title").textContent = "New note";
    $("save").textContent = "Save note";
    $("cancel").classList.add("hidden");
  }

  async function saveNote() {
    $("note-error").textContent = "";
    const body = { title: $("title").value.trim(), content: $("content").value.trim() };
    if (!body.title) { $("note-error").textContent = "Add a title."; return; }
    try {
      if (editingId) await api("/notes/" + editingId, "PUT", body);
      else await api("/notes", "POST", body);
      resetForm();
      await loadNotes();
    } catch (e) { $("note-error").textContent = e.message; }
  }

  async function removeNote(id) {
    if (!confirm("Delete this note?")) return;
    try {
      await api("/notes/" + id, "DELETE");
      if (editingId === id) resetForm();
      await loadNotes();
    } catch (e) { $("note-error").textContent = e.message; }
  }

  $("auth-submit").onclick = submitAuth;
  $("auth-toggle").onclick = () => setMode(mode === "login" ? "signup" : "login");
  $("logout").onclick = logout;
  $("save").onclick = saveNote;
  $("cancel").onclick = resetForm;
  ["email", "password", "name"].forEach((id) => $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") submitAuth(); }));

  setMode("login");
  getToken() ? openApp() : show("auth");
</script>
</body>
</html>
